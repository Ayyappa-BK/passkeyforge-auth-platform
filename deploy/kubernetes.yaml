apiVersion: v1
kind: Namespace
metadata:
  name: passkeyforge
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: passkeyforge
  namespace: passkeyforge
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: passkeyforge
spec:
  replicas: 2
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      serviceAccountName: passkeyforge
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: backend
          image: ghcr.io/replace-owner/passkeyforge-backend:replace-tag
          ports: [{name: http, containerPort: 8080}, {name: management, containerPort: 9090}]
          envFrom: [{secretRef: {name: passkeyforge-secrets}}]
          env:
            - {name: RP_ID, value: login.example.com}
            - {name: RP_ORIGIN, value: 'https://login.example.com'}
            - {name: COOKIE_SECURE, value: 'true'}
            - {name: SPRING_FLYWAY_ENABLED, value: 'false'}
            - {name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT, value: 'http://otel.observability.svc:4318/v1/traces'}
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {cpu: '2', memory: 768Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          startupProbe: {httpGet: {path: /actuator/health, port: management}, failureThreshold: 30, periodSeconds: 5}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: management}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: management}, periodSeconds: 15}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 64Mi}}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: passkeyforge
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      serviceAccountName: passkeyforge
      securityContext: {runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, fsGroup: 101, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: web
          image: ghcr.io/replace-owner/passkeyforge-frontend:replace-tag
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /, port: http}, periodSeconds: 10}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 32Mi}}]
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: passkeyforge
spec:
  selector: {app: backend}
  ports: [{name: http, port: 8080, targetPort: http}, {name: management, port: 9090, targetPort: management}]
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: passkeyforge
spec:
  selector: {app: web}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: passkeyforge
  namespace: passkeyforge
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/proxy-body-size: 64k
    nginx.ingress.kubernetes.io/limit-rps: '5'
spec:
  ingressClassName: nginx
  tls: [{hosts: [login.example.com], secretName: passkeyforge-tls}]
  rules:
    - host: login.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: web, port: {name: http}}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: passkeyforge
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: backend}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-boundary
  namespace: passkeyforge
spec:
  podSelector:
    matchLabels: {app: backend}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: web}}}]
      ports: [{protocol: TCP, port: 8080}]
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}}]
      ports: [{protocol: TCP, port: 9090}]
  egress:
    - ports: [{protocol: TCP, port: 5432}, {protocol: TCP, port: 4318}]
    - ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
