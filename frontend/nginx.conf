server {
 listen 8080;
 server_tokens off;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 64k;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), publickey-credentials-get=(self), publickey-credentials-create=(self)" always;
 add_header Cache-Control no-store always;
 location /api/ {
  proxy_pass http://backend:8080;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For "";
  proxy_set_header X-Forwarded-Proto "";
  proxy_read_timeout 30s;
 }
 location / { try_files $uri $uri/ /index.html; }
}
