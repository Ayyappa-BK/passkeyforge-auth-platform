name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: passkeyforge
          POSTGRES_USER: passkeyforge
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U passkeyforge -d passkeyforge"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_URL: jdbc:postgresql://localhost:5432/passkeyforge
      DB_USER: passkeyforge
      DB_PASSWORD: ci-only-password
      TOTP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      COOKIE_SECURE: 'false'
      RP_ORIGIN: http://localhost:5173
      MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: JUnit and PostgreSQL integration tests
        # Signed protocol fixtures use this exact origin.
        run: mvn -B -f backend/pom.xml verify -Dforge.origin=http://localhost:8080
      - name: Build React dashboard
        working-directory: frontend
        run: npm ci && npm run build
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start application for browser tests
        run: |
          java -jar backend/target/passkeyforge-1.0.0.jar > /tmp/passkeyforge.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:9090/actuator/health; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:9090/actuator/health
      - name: Browser authentication tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Build deployment images
        run: docker compose build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            backend/target/surefire-reports/
            frontend/playwright-report/
            frontend/test-results/
            /tmp/passkeyforge.log
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push versioned OCI images
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.ref_name }}
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          for component in backend frontend; do
            image="ghcr.io/$owner/passkeyforge-$component:$TAG"
            docker build -t "$image" "$component"
            docker push "$image"
          done
