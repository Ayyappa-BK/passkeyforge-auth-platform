  "components": {
    "securitySchemes": {
      "session": {
        "type": "apiKey",
        "in": "cookie",
        "name": "PFSESSION"
      },
      "csrf": {
        "type": "apiKey",
        "in": "header",
        "name": "X-CSRF-TOKEN"
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "properties": {
          "error": {
            "type": "string"
          }
        }
      },
      "Code": {
        "type": "object",
        "required": [
          "code"
        ],
        "additionalProperties": false,
        "properties": {
          "code": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          }
        }
      },
      "Finish": {
        "type": "object",
        "required": [
          "ceremonyId",
          "credential"
        ],
        "additionalProperties": false,
        "properties": {
          "ceremonyId": {
            "type": "string",
            "format": "uuid"
          },
          "credential": {
            "type": "object",
            "description": "Native PublicKeyCredential.toJSON() result; parsed and validated by Yubico."
          },
          "label": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80
          }
        }
      },
      "Name": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "username": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_]{3,64}$",
            "description": "Required for anonymous signup; ignored for existing-account enrollment."
          }
        }
      },
      "Recovery": {
        "type": "object",
        "required": [
          "username",
          "code"
        ],
        "additionalProperties": false,
        "properties": {
          "username": {
            "type": "string",
            "maxLength": 64
          },
          "code": {
            "type": "string",
            "maxLength": 128
          }
        }
      },
      "Options": {
        "type": "object",
        "required": [
          "ceremonyId",
          "options"
        ],
        "properties": {
          "ceremonyId": {
