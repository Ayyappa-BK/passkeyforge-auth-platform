{
  "openapi": "3.1.0",
  "info": {
    "title": "PasskeyForge Authentication API",
    "version": "1.0.0",
    "description": "Same-origin cookie API. Get /csrf before every mutation and send its returned header/token. FULL sessions authorize management; MFA and RECOVERY sessions are explicitly restricted."
  },
  "servers": [
    {
      "url": "/api"
    }
  ],
  "security": [
    {
      "session": []
    }
  ],
  "paths": {
    "/csrf": {
      "get": {
        "summary": "Get session CSRF token",
        "description": "Session requirement: Any. All mutation requests require the current CSRF token.",
        "operationId": "get_csrf",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "token": {
                      "type": "string"
                    },
                    "headerName": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Malformed request"
          },
          "401": {
            "description": "Authentication failed or expired"
          },
          "403": {
            "description": "CSRF or authorization rejected"
          },
          "409": {
            "description": "State conflict"
          },
          "413": {
            "description": "Request too large"
          },
          "429": {
            "description": "Rate limited"
          }
        },
        "security": []
      }
    },
